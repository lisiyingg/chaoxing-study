<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>账号管理</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/account.css">
</head>
<body>
    <div class="account-wrap">
        <div class="account-title">
            <img src="./images/zhanghaoguanli.png" alt="账号管理" class="acc-icon">
            <span>账号管理</span>
        </div>

        <div class="account-tab">
            <div class="tab-item active">基本资料</div>
            <div class="tab-item">修改头像</div>
            <div class="tab-item">密码管理</div>
            <div class="tab-item">注销账号</div>
            <div class="tab-item">语言</div>
        </div>

        <div class="account-content">
            <div class="form-row">
                <label>姓名</label>
                <span class="form-value">李思颖</span>
            </div>

            <div class="form-row">
                <label>id</label>
                <span class="form-value">418661496</span>
            </div>

            <div class="form-row">
                <label>性别</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="gender" value="male">
                        <span>男</span>
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="gender" value="female" checked>
                        <span>女</span>
                    </label>
                </div>
            </div>

            <div class="form-row">
                <label>手机号</label>
                <span class="form-value">
                    13389623403
                    <a href="#" class="link-edit">修改</a>
                </span>
            </div>

            <div class="form-row">
                <label>单位</label>
                <a href="#" class="link-add">+ 添加单位</a>
            </div>

            <div class="form-row unit-row">
                <div class="unit-box">
                    <div class="unit-name">重庆理工大学</div>
                    <div class="unit-sub">学号/工号:12523040221</div>
                </div>
            </div>

            <div class="form-row unit-row">
                <div class="unit-box">
                    <div class="unit-name">重庆理工大学图书馆</div>
                    <div class="unit-sub">学号/工号:12523040221</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
